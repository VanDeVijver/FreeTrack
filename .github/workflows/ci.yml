name: CI

on:
  push:
    branches: [main, render-free]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build FreeTrack.sln -c Release
      # Same image Render builds, so a broken Dockerfile fails here instead of at deploy time.
      - run: docker build -t freetrack .
