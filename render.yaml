services:
  - type: web
    name: freetrack
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Neon connection string (direct, non-pooled host). Either postgresql:// URI or key=value works.
      - key: ConnectionStrings__Default
        sync: false
      # Admin account created on first boot. Password needs 10+ chars with upper, lower, digit and symbol.
      - key: Admin__Username
        sync: false
      - key: Admin__Password
        sync: false
      # Booking notification emails via Resend's HTTPS API (the free plan blocks SMTP).
      - key: Email__ApiKey
        sync: false
      # Must be the email address the Resend account was created with until a domain is verified.
      - key: Email__AdminEmail
        sync: false
